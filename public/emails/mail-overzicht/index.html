<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- De pagina wordt vanuit public/ geserveerd en is ook bereikbaar op /mail-overzicht
     (zonder slash, via de rewrite in next.config.ts). Zonder deze base zouden de
     relatieve paden naar ./emails/ en ./assets/ dan naar de site-root wijzen. -->
<base href="/mail-overzicht/" />
<title>ViaLuxury — E-maildesigns</title>
<meta name="description" content="Alle e-mailontwerpen van ViaLuxury op één plek, met licht/donker- en mobiel/desktop-weergave en de productie-HTML." />
<link rel="icon" href="./assets/logo-vialuxury-horizontal.svg" />

<style>
  /* Brand fonts. Drop the .ttf files in ./assets/fonts/ to activate them;
     tot die tijd vallen we terug op de systeem-fallbacks hieronder. */
  @font-face { font-family: 'Recoleta'; src: url('./assets/fonts/Recoleta-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Basis Grotesque Pro'; src: url('./assets/fonts/basisgrotesque-regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Basis Grotesque Pro'; src: url('./assets/fonts/basisgrotesque-bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

  :root {
    --brand: #206861;
    --accent: #FB862C;
    --bg: #F5F5F5;
    --fg: #1A1A1A;
    --muted: #6b6b6b;
    --surface: #fff;
    --border: #e6e6e6;
    --border-strong: #d9d9d9;
    --border-rule: #dcdcdc;
    --track: #ececec;
    --font-display: 'Recoleta', Georgia, 'Times New Roman', serif;
    --font-body: 'Basis Grotesque Pro', Helvetica, Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--brand); }

  h1, h2 {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--brand);
    margin: 0;
  }

  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- Topbar ---------- */

  .topbar {
    background: var(--brand);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar__logo { height: 18px; width: auto; display: block; }

  .topbar__label {
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    border-left: 1px solid rgba(255, 255, 255, 0.3);
    padding-left: 16px;
  }

  .shell { max-width: 1120px; margin: 0 auto; padding: 40px 32px 64px; }

  /* ---------- Index ---------- */

  .page-title { font-size: 32px; }
  .page-intro { color: var(--muted); margin: 8px 0 0; max-width: 72ch; }
  .section-title { font-size: 24px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }

  .chip {
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip:hover { border-color: var(--brand); }

  .chip[aria-pressed="true"] {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  .chip--reset {
    border-color: transparent;
    background: transparent;
    color: var(--muted);
  }

  .chip--reset:hover { border-color: transparent; color: var(--fg); }
  .chip--reset[hidden] { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    margin-top: 24px;
  }

  .card {
    font: inherit;
    text-align: left;
    color: inherit;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: box-shadow 0.18s ease, transform 0.18s ease;
  }

  .card:hover {
    box-shadow: 0 8px 24px rgba(26, 26, 26, 0.12);
    transform: translateY(-2px);
  }

  .card[hidden] { display: none; }

  .card__preview {
    height: 300px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    pointer-events: none;
  }

  /* 664px scaled to 0.5 = 332px wide, gecentreerd met -166px */
  .card__preview > * {
    position: absolute;
    top: 0;
    left: 50%;
    margin-left: -166px;
    width: 664px;
    border: 0;
    display: block;
    transform: scale(0.5);
    transform-origin: top left;
  }

  .card__body { padding: 18px 20px 20px; border-top: 1px solid #eee; }
  .card__title { font-size: 19px; margin-bottom: 6px; }
  .card__desc { margin: 0; color: var(--muted); font-size: 14px; }

  .rule { border: 0; border-top: 1px solid var(--border-rule); margin: 48px 0 32px; }

  /* ---------- Detail ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .toolbar__title { font-size: 22px; margin: 0 8px; }
  .toolbar__spacer { flex: 1; }

  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--fg);
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s ease;
  }

  .btn:hover { border-color: var(--brand); }

  .btn--primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .btn--primary:hover { border-color: var(--accent); filter: brightness(0.95); }

  .segmented {
    display: inline-flex;
    gap: 4px;
    background: var(--track);
    border-radius: 10px;
    padding: 4px;
  }

  .segmented[hidden] { display: none; }

  .segmented__option {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    background: transparent;
    color: var(--fg);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .segmented__option[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .stage-wrap { display: flex; justify-content: center; }

  .stage {
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    background: var(--bg);
    min-height: 600px;
    overflow: hidden;
    max-width: 100%;
    transition: width 0.2s ease;
  }

  .stage > iframe { display: block; width: 100%; border: 0; min-height: 600px; }

  /* ---------- Placeholder voor nog niet geïmplementeerde designs ---------- */

  .missing {
    height: 100%;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    background:
      repeating-linear-gradient(135deg, rgba(32, 104, 97, 0.05) 0 10px, transparent 10px 20px),
      var(--bg);
  }

  .missing__title { font-family: var(--font-display); font-size: 17px; color: var(--brand); }
  .missing__path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .card__preview .missing { position: static; width: auto; margin: 0; transform: none; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--fg);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(26, 26, 26, 0.2);
  }

  .toast[hidden] { display: none; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .topbar { padding: 16px 20px; }
    .shell { padding: 28px 20px 48px; }
    .page-title { font-size: 26px; }
    .toolbar__spacer { display: none; }
    .toolbar__title { margin: 0; flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header class="topbar">
  <img class="topbar__logo" src="./assets/logo-vialuxury-horizontal.svg" alt="ViaLuxury" />
  <span class="topbar__label">E-maildesigns</span>
</header>

<main class="shell">
  <!-- Index -->
  <section id="index-view">
    <h1 class="page-title">E-maildesigns</h1>
    <p class="page-intro">Alle e-mailontwerpen van ViaLuxury op één plek. Klik op een ontwerp voor een grote preview, licht/donker- en mobiel/desktop-weergave en de productie-HTML.</p>

    <div class="filters" id="filters" role="group" aria-label="Filter op categorie"></div>

    <div class="grid" id="grid-main"></div>

    <hr class="rule" />
    <h2 class="section-title">Inspiration examples</h2>
    <div class="grid" id="grid-inspiration"></div>
  </section>

  <!-- Detail -->
  <section id="detail-view" hidden>
    <div class="toolbar">
      <button class="btn" type="button" id="back">← Alle designs</button>
      <h1 class="toolbar__title" id="detail-title"></h1>
      <div class="toolbar__spacer"></div>
      <div class="segmented" id="versions" role="group" aria-label="Versie"></div>
      <div class="segmented" role="group" aria-label="Weergavemodus">
        <button class="segmented__option" type="button" data-mode="light">Licht</button>
        <button class="segmented__option" type="button" data-mode="dark">Donker</button>
      </div>
      <div class="segmented" role="group" aria-label="Schermbreedte">
        <button class="segmented__option" type="button" data-width="desktop">Desktop</button>
        <button class="segmented__option" type="button" data-width="mobile">Mobiel</button>
      </div>
      <button class="btn btn--primary" type="button" id="copy">Kopieer HTML</button>
      <button class="btn" type="button" id="download">Download .html</button>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  "use strict";

  // Waar de losse e-maildesigns staan. Elk bestand is een compleet HTML-document
  // dat ?mode=light|dark en ?layout=desktop|mobile van de query string leest.
  const EMAIL_DIR = "./emails/";
  const fileFor = (component) => EMAIL_DIR + component + ".html";

  /**
   * Eén registry-entry per e-maildesign.
   *  category   — filtergroep op de indexpagina ("welkom" | "reminder" | "klant"),
   *               of null voor de inspiration-sectie (nooit gefilterd).
   *  versions   — component per versienummer, in de volgorde van de versie-toggle.
   *  defaultVersion — versie waarmee de detailweergave opent.
   *  cardVersion    — versie die als kaartpreview op de index staat.
   */
  const DESIGNS = [
    {
      slug: "welkom-mail-1a",
      title: "Welkom (Mail 1A)",
      category: "welkom",
      description: "Welkomstmail na eerste boeking: account, FAQ, deal-opt-in en thema-inspiratie. Drie versies — v1, v2 en v3 — te wisselen in de detailweergave.",
      versions: { 1: "Mail1A", 2: "Mail1Av2", 3: "Mail1Av3", 4: "Mail1Av4", 5: "Mail1Av5" },
      defaultVersion: 5,
      cardVersion: 5,
    },
    {
      slug: "welkom-mail-1b",
      title: "Welkom (Mail 1B)",
      category: "welkom",
      description: "Welkomstmail voor klanten die al deals ontvangen: opt-in voor niet-hotel deals bovenaan, daarna account, FAQ en thema-inspiratie. Naar Figma-frame 'mail 1B customer mobile'.",
      versions: { 1: "Mail1B", 2: "Mail1Bv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "mail-1a-fan",
      title: "Welkom (Mail 1A FAN)",
      category: "welkom",
      description: "Welkomstmail na inschrijving op de nieuwsbrief: €10 welkomstkorting met code, drie populaire arrangementen en deal-opt-in. Naar Figma-frame 'mail-1A-fan-mobile'.",
      versions: { 1: "Mail1AFan", 2: "Mail1AFanv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "mail-2-reminder",
      title: "Reminder welkom code (Mail 2)",
      category: "reminder",
      description: "Herinnering aan de ongebruikte €10 welkomstkorting, met kortingscode en thema-inspiratie. Naar Figma-frame 'Mail 2 Fan Mobiel'.",
      versions: { 1: "Mail2Reminder" },
      defaultVersion: 1,
      cardVersion: 1,
    },
    {
      slug: "mail-3-reminder",
      title: "Reminder welkom code (Mail 3)",
      category: "reminder",
      description: "Laatste herinnering aan de €10 korting, met drie arrangementen om direct te besteden. Naar Figma-frame 'Mail 3 Fan Mobile'.",
      versions: { 1: "Mail3Reminder", 2: "Mail3Reminderv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "mail-4-reminder",
      title: "Reminder welkom code (Mail 4)",
      category: "reminder",
      description: "Urgentie-mail: nog 3 dagen geldig, met drie inspiratiethema's en de kortingscode onderaan. Naar Figma-frame 'Mail 4 Fan Mobiel'.",
      versions: { 1: "Mail4Reminder" },
      defaultVersion: 1,
      cardVersion: 1,
    },
    {
      slug: "mail-5-reminder",
      title: "Reminder welkom code (Mail 5)",
      category: "reminder",
      description: "Laatste kans: binnen 24 uur verloopt de €10 korting, met best geboekte arrangementen en een blijf-op-de-hoogte blok. Naar Figma-frame 'Mail 5 Fan Mobiel'.",
      versions: { 1: "Mail5Reminder", 2: "Mail5Reminderv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "klant-geboekt-uitgeschreven",
      title: "Klant geboekt & uitgeschreven (transactioneel)",
      category: "klant",
      description: "Voor klanten die wel boekten maar zijn uitgeschreven: opt-in terugwinnen, boekingsgegevens in het account en FAQ. Naar Figma-frame 'Klant geboekt & uitgeschreven (transactioneel) - mobile'.",
      versions: { 1: "KlantGeboektUitgeschreven", 2: "KlantGeboektUitgeschrevenv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "klant-geboekt-inactief",
      title: "Klant geboekt & inactief (transactioneel)",
      category: "klant",
      description: "Reactivatie voor klanten die boekten maar inactief werden: welkom terug, boekingsgegevens en FAQ met CTA naar de site. Naar Figma-frame 'Klant geboekt & inactief (transactioneel) - mobile'.",
      versions: { 1: "KlantGeboektInactief", 2: "KlantGeboektInactiefv2" },
      defaultVersion: 2,
      cardVersion: 2,
    },
    {
      slug: "booking-confirmation",
      title: "Boekingsbevestiging",
      category: null,
      description: "Transactionele bevestiging na een geslaagde boeking, met reisdetails en totaalprijs.",
      versions: { 1: "Boekingsbevestiging" },
      defaultVersion: 1,
      cardVersion: 1,
    },
    {
      slug: "deal-alert",
      title: "Deal van de week",
      category: null,
      description: "Commerciële nieuwsbrief rond één deal: hero-foto, USP's, oude vs. nieuwe prijs en CTA.",
      versions: { 1: "DealVanDeWeek" },
      defaultVersion: 1,
      cardVersion: 1,
    },
  ];

  const FILTERS = [
    { key: "welkom", label: "Welkom inschrijving" },
    { key: "reminder", label: "Reminder welkom code" },
    { key: "klant", label: "Reminder bestaande klant" },
  ];

  const bySlug = new Map(DESIGNS.map((d) => [d.slug, d]));

  const state = {
    slug: null,
    version: 1,
    mode: "light",
    width: "desktop",
    filter: null, // één actieve categorie, of null voor "alles"
  };

  const el = {
    indexView: document.getElementById("index-view"),
    detailView: document.getElementById("detail-view"),
    filters: document.getElementById("filters"),
    gridMain: document.getElementById("grid-main"),
    gridInspiration: document.getElementById("grid-inspiration"),
    detailTitle: document.getElementById("detail-title"),
    versions: document.getElementById("versions"),
    stage: document.getElementById("stage"),
    back: document.getElementById("back"),
    copy: document.getElementById("copy"),
    download: document.getElementById("download"),
    toast: document.getElementById("toast"),
  };

  // ---------- Beschikbaarheid van de losse designbestanden ----------

  const availability = new Map();

  // Bij file:// is fetch geblokkeerd; dan renderen we de iframe optimistisch.
  const canProbe = location.protocol === "http:" || location.protocol === "https:";

  async function isAvailable(src) {
    if (!canProbe) return true;
    if (!availability.has(src)) {
      availability.set(src, fetch(src, { method: "HEAD" })
        .then((r) => (r.status === 405 ? fetch(src, { method: "GET" }) : r))
        .then((r) => r.ok)
        .catch(() => false));
    }
    return availability.get(src);
  }

  function missingNode(component) {
    const box = document.createElement("div");
    box.className = "missing";
    const title = document.createElement("div");
    title.className = "missing__title";
    title.textContent = "Design nog niet geïmplementeerd";
    const path = document.createElement("div");
    path.className = "missing__path";
    path.textContent = fileFor(component);
    box.append(title, path);
    return box;
  }

  function frameNode(component, { mode, layout, title }) {
    const frame = document.createElement("iframe");
    frame.src = fileFor(component) + "?mode=" + mode + "&layout=" + layout;
    frame.title = title;
    frame.loading = "lazy";
    frame.setAttribute("scrolling", "no");
    // Same-origin: hoogte meeschalen met de inhoud van de e-mail.
    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        if (doc) frame.style.height = doc.documentElement.scrollHeight + "px";
      } catch (e) { /* cross-origin — laat de CSS-hoogte staan */ }
    });
    return frame;
  }

  /** Rendert component in host: iframe als het bestand bestaat, anders een placeholder. */
  async function mount(host, component, opts) {
    const src = fileFor(component);
    const ok = await isAvailable(src);
    host.replaceChildren(ok ? frameNode(component, opts) : missingNode(component));
  }

  // ---------- Index ----------

  function renderFilters() {
    el.filters.replaceChildren();
    for (const f of FILTERS) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = f.label;
      chip.setAttribute("aria-pressed", String(state.filter === f.key));
      chip.addEventListener("click", () => {
        state.filter = state.filter === f.key ? null : f.key;
        renderFilters();
        applyFilter();
      });
      el.filters.append(chip);
    }
    const reset = document.createElement("button");
    reset.type = "button";
    reset.className = "chip chip--reset";
    reset.textContent = "Wis filter";
    reset.hidden = state.filter === null;
    reset.addEventListener("click", () => {
      state.filter = null;
      renderFilters();
      applyFilter();
    });
    el.filters.append(reset);
  }

  function applyFilter() {
    for (const card of el.gridMain.children) {
      card.hidden = state.filter !== null && card.dataset.category !== state.filter;
    }
  }

  function cardNode(design) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.category = design.category || "";

    const preview = document.createElement("div");
    preview.className = "card__preview";

    const body = document.createElement("div");
    body.className = "card__body";
    const title = document.createElement("h2");
    title.className = "card__title";
    title.textContent = design.title;
    const desc = document.createElement("p");
    desc.className = "card__desc";
    desc.textContent = design.description;
    body.append(title, desc);

    card.append(preview, body);
    card.addEventListener("click", () => openDetail(design.slug));

    mount(preview, design.versions[design.cardVersion], {
      mode: "light",
      layout: "desktop",
      title: design.title + " — preview",
    });

    return card;
  }

  function renderIndex() {
    renderFilters();
    el.gridMain.replaceChildren(...DESIGNS.filter((d) => d.category).map(cardNode));
    el.gridInspiration.replaceChildren(...DESIGNS.filter((d) => !d.category).map(cardNode));
    applyFilter();
  }

  // ---------- Detail ----------

  function currentDesign() { return bySlug.get(state.slug); }

  function currentComponent() {
    const design = currentDesign();
    return design.versions[state.version] || design.versions[design.defaultVersion];
  }

  function renderVersions() {
    const design = currentDesign();
    const numbers = Object.keys(design.versions).map(Number).sort((a, b) => a - b);
    el.versions.hidden = numbers.length < 2;
    el.versions.replaceChildren(...numbers.map((n) => {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "segmented__option";
      opt.textContent = "v" + n;
      opt.setAttribute("aria-pressed", String(state.version === n));
      opt.addEventListener("click", () => {
        state.version = n;
        renderDetail();
      });
      return opt;
    }));
  }

  function renderToggles() {
    for (const opt of document.querySelectorAll("[data-mode]")) {
      opt.setAttribute("aria-pressed", String(opt.dataset.mode === state.mode));
    }
    for (const opt of document.querySelectorAll("[data-width]")) {
      opt.setAttribute("aria-pressed", String(opt.dataset.width === state.width));
    }
  }

  function renderDetail() {
    const design = currentDesign();
    const multi = Object.keys(design.versions).length > 1;

    el.detailTitle.textContent = design.title + (multi ? " — v" + state.version : "");
    renderVersions();
    renderToggles();

    el.stage.style.width = state.width === "mobile" ? "375px" : "700px";
    mount(el.stage, currentComponent(), {
      mode: state.mode,
      layout: state.width === "mobile" ? "mobile" : "desktop",
      title: el.detailTitle.textContent,
    });
  }

  function openDetail(slug) {
    const design = bySlug.get(slug);
    state.slug = slug;
    state.version = design.defaultVersion;
    el.indexView.hidden = true;
    el.detailView.hidden = false;
    window.scrollTo({ top: 0 });
    renderDetail();
  }

  function closeDetail() {
    state.slug = null;
    el.detailView.hidden = true;
    el.indexView.hidden = false;
    el.stage.replaceChildren();
  }

  // ---------- Kopieer / download de productie-HTML ----------

  let toastTimer = null;

  function toast(message) {
    el.toast.textContent = message;
    el.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.toast.hidden = true; }, 2500);
  }

  async function productionHtml() {
    const src = fileFor(currentComponent());
    const response = await fetch(src);
    if (!response.ok) throw new Error(src + " — HTTP " + response.status);
    return response.text();
  }

  /** Fallback voor contexts zonder clipboard-permissie (o.a. niet-secure origins). */
  function legacyCopy(text) {
    const area = document.createElement("textarea");
    area.value = text;
    area.className = "sr-only";
    document.body.append(area);
    area.select();
    const ok = document.execCommand("copy");
    area.remove();
    if (!ok) throw new Error("execCommand('copy') werd geweigerd");
  }

  async function copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      legacyCopy(text);
    }
  }

  el.copy.addEventListener("click", async () => {
    const label = el.copy.textContent;
    try {
      await copyToClipboard(await productionHtml());
      el.copy.textContent = "Gekopieerd ✓";
      setTimeout(() => { el.copy.textContent = label; }, 2000);
    } catch (e) {
      toast("Kopiëren mislukt: " + e.message);
    }
  });

  el.download.addEventListener("click", async () => {
    try {
      const blob = new Blob([await productionHtml()], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = state.slug + "-" + state.mode + ".html";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) {
      toast("Download mislukt: " + e.message);
    }
  });

  el.back.addEventListener("click", closeDetail);

  for (const opt of document.querySelectorAll("[data-mode]")) {
    opt.addEventListener("click", () => { state.mode = opt.dataset.mode; renderDetail(); });
  }
  for (const opt of document.querySelectorAll("[data-width]")) {
    opt.addEventListener("click", () => { state.width = opt.dataset.width; renderDetail(); });
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.slug) closeDetail();
  });

  renderIndex();
})();
</script>
</body>
</html>
